name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npx tsc --noEmit -p tests/tsconfig.json
      - run: npm test
      - run: npm run build

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Existing lint errors are being cleaned up during the Phase 1 UI work;
      # make this blocking once `npm run lint` is clean.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bakiguard-backend ./backend
      - run: docker build -t bakiguard-ai ./ai-service
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:5000/api -t bakiguard-frontend ./frontend
